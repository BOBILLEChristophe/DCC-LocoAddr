author=Christophe BOBILLE <38000184+BOBILLEChristophe@users.noreply.github.com>
maintainer=Christophe BOBILLE <38000184+BOBILLEChristophe@users.noreply.github.com>
sentence=Lecture de l'adresse DCC des locomotives (décodeurs compatibles RailCom) et du sens de pose, avec un détecteur Locoduino LocoAddr v3.1, sur ESP32, Raspberry Pi Pico ou Arduino Mega 2560.
paragraph=Réception à 250 kbit/s (UART matériel ou PIO), découpage par cutout, décodage 4/8 du canal 1, adresses courtes, longues et de consist, validation et détection de perte, lecture de la sortie DIR (option sens de pose). Plusieurs détecteurs : jusqu'à 3 sur ESP32 et Arduino Mega 2560, jusqu'à 10 sur RP2040 et 14 sur RP2350.
category=Communication
