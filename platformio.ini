; DCC-LocoAddr - projet de développement PlatformIO
; -------------------------------------------------
; Ce dépôt est d'abord une bibliothèque Arduino/PlatformIO (src/, examples/),
; mais ce fichier permet aussi de compiler directement les principaux exemples
; et les deux afficheurs depuis la racine du dépôt.
;
; Commandes utiles :
;   pio run -e esp32-basic
;   pio run -e esp32-multi
;   pio run -e esp32-display
;   pio run -e esp32c3-mini-display
;   pio run -e native-decoder
;
; Téléversement :
;   pio run -e esp32-basic -t upload
; Moniteur série :
;   pio device monitor -b 115200

[platformio]
default_envs = esp32-basic
src_dir = .

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -Isrc
    -Wall
    -Wextra
library_sources =
    -<*>
    +<src/LocoAddrReader_ESP32.cpp>
    +<src/LocoAddrDecoder.cpp>

[env:esp32-basic]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
build_src_filter =
    ${common.library_sources}
    +<development/platformio/esp32-basic/main.cpp>

[env:esp32-multi]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
build_src_filter =
    ${common.library_sources}
    +<development/platformio/esp32-multi/main.cpp>

[env:esp32-display]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
build_src_filter =
    ${common.library_sources}
    +<development/platformio/esp32-display/main.cpp>

[env:esp32c3-mini-display]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-c3-devkitm-1
monitor_speed = ${common.monitor_speed}

build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    https://github.com/avishorp/TM1637.git

build_src_filter =
    ${common.library_sources}
    +<development/platformio/esp32c3-mini-display/main.cpp>

; Le coeur LocoAddrDecoder ne dépend ni d'Arduino ni de l'ESP32.
; Cet environnement vérifie au minimum qu'il compile sur PC.
[env:native-decoder]
platform = native
build_flags =
    -Isrc
    -std=gnu++17
    -Wall
    -Wextra
    -pedantic
build_src_filter =
    -<*>
    +<src/LocoAddrDecoder.cpp>
    +<extras/tests/test_decoder.cpp>

